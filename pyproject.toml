[project]
name = "foxreach"
version = "0.6.0"
description = "Official Python SDK for the FoxReach cold email outreach API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FoxReach", email = "dev@foxreach.io" }]
keywords = ["foxreach", "cold-email", "outreach", "email", "sdk", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0,<1.0",
]

[project.urls]
Homepage = "https://foxreach.io"
Documentation = "https://www.foxreach.io/docs/sdks/python"
Repository = "https://github.com/foxreach/foxreach-python-sdk"
Changelog = "https://www.foxreach.io/docs/changelog"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
